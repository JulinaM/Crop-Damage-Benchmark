# @package _global_
defaults:
  - /base
  - _self_

task: Segmentation
experiment_name: ${task}_terramind_pooled

# Label class_remap and model.{ignore_index,negative_class,positive_class} are
# tied together -- see crop_damage/datasets/AgDamageShardDataset.py header for
# how the raw label.tif band-1 values map to these ids.
train_loader:
  dataset: agdamage_shard
  data_root: data/input/J_AgDamage/AgDamage_v2
  hazards: [Flood, Burnt]
  modalities:
    S2L2A: {}
    S1GRD: {}
  label_band: 1
  label_nodata: 255
  class_remap: {1: 2, 2: 1, 3: 0, 4: 0}
  num_augmentations: 5
  patch_size: 512
  preload: False
  batch_size: 4
  shuffle: True
  num_workers: 2

validation_loader:
  dataset: agdamage_shard
  data_root: data/input/J_AgDamage/AgDamage_v2
  hazards: [Flood, Burnt]
  modalities:
    S2L2A: {}
    S1GRD: {}
  label_band: 1
  label_nodata: 255
  class_remap: {1: 2, 2: 1, 3: 0, 4: 0}
  patch_size: 512
  preload: False
  batch_size: 4
  shuffle: False
  num_workers: 2

# Pooled in-distribution eval, plus per-hazard breakdowns (recommended by
# CLAUDE.md sec.4: "report per-hazard/per-region separately, don't pool").
eval_loaders:
  in_distribution_pooled:
    dataset: agdamage_shard
    data_root: data/input/J_AgDamage/AgDamage_v2
    hazards: [Flood, Burnt]
    split: test
    modalities:
      S2L2A: {}
      S1GRD: {}
    label_band: 1
    label_nodata: 255
    class_remap: {1: 2, 2: 1, 3: 0, 4: 0}
    patch_size: 512
    num_workers: 2
  in_distribution_flood:
    dataset: agdamage_shard
    data_root: data/input/J_AgDamage/AgDamage_v2
    hazards: [Flood]
    split: test
    modalities:
      S2L2A: {}
      S1GRD: {}
    label_band: 1
    label_nodata: 255
    class_remap: {1: 2, 2: 1, 3: 0, 4: 0}
    patch_size: 512
    num_workers: 2
  in_distribution_burnt:
    dataset: agdamage_shard
    data_root: data/input/J_AgDamage/AgDamage_v2
    hazards: [Burnt]
    split: test
    modalities:
      S2L2A: {}
      S1GRD: {}
    label_band: 1
    label_nodata: 255
    class_remap: {1: 2, 2: 1, 3: 0, 4: 0}
    patch_size: 512
    num_workers: 2

model:
  num_classes: 3
  positive_class: 2
  negative_class: 1
  ignore_index: 0
  learning_rate: 0.0005
  num_epochs: 8
  seed: 22

encoder:
  name: Terramind
  version: terramind_v1_base
  pretrained: true
  finetune: false
  modalities: ["S2L2A", "S1GRD"]
  token_dim: 768
  feature_indices: [3, 5, 7, 9, 11]
  build_kwargs: {}

decoder:
  name: UNet
  channels: [64, 128, 256, 512, 1024]

trainer:
  n_epochs: 2
  log_interval: 1

use_wandb: False

criterion:
  name: ce #dice_focal, ce
  apply_weight_loss: False
  weight_type: inverse
  dice_weight: 0.5
  focal_weight: 0.5
  focal_gamma: 2.0
  focal_alpha: null
  dice_smooth: 1e-6

change:
  method: attention_based_cross_time_fusion # concatenate_all_three, siamese_fusion, attention_based_cross_time_fusion, signed_difference_plus_absolute_difference
  attention_heads: 4
