# @package _global_
dataset_name: pooled

train_loader:
  hazards: [Flooded, Burnt]
  patch_size: 512

validation_loader:
  hazards: [Flooded, Burnt]
  patch_size: 512

# Pooled in-distribution eval, plus per-hazard breakdowns (recommended by
# CLAUDE.md sec.4: "report per-hazard/per-region separately, don't pool").
eval_loaders:
  in_distribution_pooled:
    dataset: agdamage_shard
    data_root: /fs/ess/PGS0413/AgDamage_Benchmark_v2_resharded
    hazards: [Flooded, Burnt]
    split: test
    modalities:
      S2L2A: {}
      S1GRD: {}
    label_band: 1
    label_nodata: 255
    class_remap: {1: 2, 2: 1, 3: 0, 4: 0}
    patch_size: 512
    num_workers: 2
  in_distribution_flood:
    dataset: agdamage_shard
    data_root: /fs/ess/PGS0413/AgDamage_Benchmark_v2_resharded
    hazards: [Flooded]
    split: test
    modalities:
      S2L2A: {}
      S1GRD: {}
    label_band: 1
    label_nodata: 255
    class_remap: {1: 2, 2: 1, 3: 0, 4: 0}
    patch_size: 512
    num_workers: 2
  in_distribution_burnt:
    dataset: agdamage_shard
    data_root: /fs/ess/PGS0413/AgDamage_Benchmark_v2_resharded
    hazards: [Burnt]
    split: test
    modalities:
      S2L2A: {}
      S1GRD: {}
    label_band: 1
    label_nodata: 255
    class_remap: {1: 2, 2: 1, 3: 0, 4: 0}
    patch_size: 512
    num_workers: 2
