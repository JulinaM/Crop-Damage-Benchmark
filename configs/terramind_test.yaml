defaults:
  - base
  - _self_

# Fast smoke-test config: verifies the full AgDamageShardDataset pipeline
# (loader -> encoder -> change fusion -> decoder -> trainer -> evaluator)
# runs end to end in a couple minutes. Not meant for real results.
task: Segmentation
experiment_name: ${task}_small

train_loader:
  dataset: agdamage_shard
  data_root: data/input/J_AgDamage/AgDamage_v2
  hazards: [Flood]
  modalities:
    S2L2A: {}
    S1GRD: {}
  label_band: 1
  label_nodata: 255
  class_remap: {1: 2, 2: 1, 3: 0, 4: 0}
  num_augmentations: 2
  patch_size: 224
  preload: False
  max_chips: 40
  batch_size: 4
  shuffle: True
  num_workers: 2

validation_loader:
  dataset: agdamage_shard
  data_root: data/input/J_AgDamage/AgDamage_v2
  hazards: [Flood]
  modalities:
    S2L2A: {}
    S1GRD: {}
  label_band: 1
  label_nodata: 255
  class_remap: {1: 2, 2: 1, 3: 0, 4: 0}
  patch_size: 224
  preload: False
  max_chips: 8
  batch_size: 4
  shuffle: False
  num_workers: 2

eval_loaders:
  in_distribution:
    dataset: agdamage_shard
    data_root: data/input/J_AgDamage/AgDamage_v2
    hazards: [Flood]
    split: test
    modalities:
      S2L2A: {}
      S1GRD: {}
    label_band: 1
    label_nodata: 255
    class_remap: {1: 2, 2: 1, 3: 0, 4: 0}
    patch_size: 224
    max_chips: 8
    num_workers: 2

model:
  num_classes: 3
  positive_class: 2
  negative_class: 1
  ignore_index: 0
  learning_rate: 0.0005
  num_epochs: 3
  seed: 22

encoder:
  name: Terramind
  version: terramind_v1_base
  pretrained: true
  finetune: false
  modalities: ["S2L2A", "S1GRD"]
  token_dim: 768
  feature_indices: [3, 5, 7, 9, 11]
  build_kwargs: {}

decoder:
  name: UNet
  channels: [64, 128, 256, 512, 1024]

trainer:
  n_epochs: 2
  log_interval: 1

use_wandb: False

criterion:
  name: ce #dice_focal, ce
  apply_weight_loss: True
  weight_type: inverse
  dice_weight: 0.5
  focal_weight: 0.5
  focal_gamma: 2.0
  focal_alpha: null
  dice_smooth: 1e-6

change:
  method: difference
  attention_heads: 4
