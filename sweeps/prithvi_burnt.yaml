# W&B sweep for configs/segmentation/prithvi_burnt_sweep.yaml (frozen Prithvi).
#   wandb sweep sweeps/prithvi_burnt.yaml      # prints the SWEEP_ID
#   sbatch --job-name=PR_burnt --array=0-6%4 --time=12:00:00 \
#          --export=SWEEP_ID=<entity/project/id> slurm/sweep_agent.slurm
#
# Same learning-rate grid and early termination as sweeps/prithvi_flood.yaml;
# batch size fixed at 16.
project: Crop-Damage-Benchmark
entity: julinam-kent-state-university
name: prithvi_burnt_hparams
program: crop_damage/main.py
method: grid
metric:
  # val IoU of the damaged-crop class at the epoch with the lowest val loss,
  # i.e. the checkpoint that would actually be kept.
  name: best/IoU
  goal: maximize
early_terminate:
  type: hyperband
  min_iter: 3
  eta: 2
parameters:
  model.learning_rate:
    values: [3.0e-5, 6.0e-5, 1.2e-4, 2.5e-4, 5.0e-4, 1.0e-3, 3.0e-3]
command:
  - ${env}
  - python3
  - -u
  - -m
  - crop_damage
  - --config-name=segmentation/prithvi_burnt_sweep
  - ${args_no_hyphens}
